name: Actualizar competiciones
on:
  schedule:
    - cron: '17 5 * * *'   # cada día a las 7:17 (hora de Madrid en verano)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/actualizar-competiciones.mjs
      - name: Guardar cambios
        run: |
          git config user.name "first-sip-bot"
          git config user.email "first-sip-bot@users.noreply.github.com"
          git add competiciones.json competiciones.ics actualizacion.log
          git diff --cached --quiet || (git commit -m "Competiciones actualizadas $(date -u +%F)" && git push)
